# Serves the Vite/React 19 static build AND reverse-proxies /api/v1/* to the
# `api` container — this is the single entry point for the whole app (Caddy
# removed: one fewer container, and the org's own upstream proxy/gateway now
# owns TLS termination, see docs/deployment-guide.md). Runs as the
# unprivileged `nginx` user (see web.Dockerfile) — non-privileged listen port
# (8080) required because binding <1024 needs root.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same headers Caddy used to add — kept here since nothing else in this
    # stack sets them now. No HSTS: this container itself never terminates
    # TLS, so claiming "always HTTPS" here would be a lie; whatever sits in
    # front (if anything) owns that header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'" always;

    # API first (more specific) — everything else below falls through to the
    # static file rules / SPA fallback. `$api_upstream` + `resolver` (Docker
    # Compose's embedded DNS) instead of a bare `proxy_pass http://api:3000`:
    # nginx otherwise resolves a literal hostname ONCE at startup and keeps
    # that IP forever, so if the `api` container restarts on its own (without
    # `web` also restarting) every request here would 502 against a dead IP.
    resolver 127.0.0.11 valid=30s;
    location /api/v1/ {
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets (Vite content-hashes filenames) are immutable —
    # cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated — it references the current
    # hashed asset filenames, so a stale cached copy points at deleted files.
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: any unmatched path (client-side react-router route) still
    # serves index.html instead of a static 404.
    location / {
        try_files $uri /index.html;
    }
}
