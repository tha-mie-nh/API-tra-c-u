name: app-tra-cuu-du-lieu

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_tra_cuu}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_tra_cuu}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
    ports:
      - '${API_PORT:-3000}:3000'
    volumes:
      # WORKDIR in docker/api.Dockerfile is /repo, and APP_CONFIG_PATH
      # ("./config/config.json") resolves relative to it — must be /repo/config,
      # not /app/config (mismatch here silently made this mount dead: the app
      # would read whatever config.json got baked into the image at build
      # time instead of this bind mount).
      # Writable (NOT :ro) — the admin-UI datasource API atomically writes
      # config.json (tmp file + .bak + rename, inside this dir). Host
      # ./config must be writable by uid 1000 (container's `node` user) —
      # see docs/deployment-guide.md's chown prerequisite.
      - ./config:/repo/config
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ['full']

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    ports:
      # nginx inside the container listens on 8080 (unprivileged, non-root
      # user — see docker/web.Dockerfile), not 80.
      - '${WEB_PORT:-5173}:8080'
    depends_on:
      - api
    profiles: ['full']

volumes:
  postgres-data:
